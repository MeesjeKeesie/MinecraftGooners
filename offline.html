<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Thema meteen zetten, vóór de pagina tekent. Moet inline: een extern
       bestand laadt te laat en dan zie je een flits van het verkeerde thema. -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("mcg-scheme");
        if (s !== "light" && s !== "dark") {
          s = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-scheme", s);
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("mcg-theme") === "kerst" ? "kerst" : "standaard"
        );
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#14171b">
  <title>Geen verbinding — MinecraftGooners</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark">&#9635;</span> MinecraftGooners</a>
    </div>
  </nav>

  <main class="container">
    <div class="login-wrap">
      <div style="text-align:center; max-width:34em;">
        <span class="eyebrow">Offline</span>
        <h1 style="font-size:1.8rem;">Geen verbinding</h1>
        <p class="lede" style="margin-left:auto; margin-right:auto;">
          Je apparaat heeft op dit moment geen internet, dus we kunnen niet
          ophalen of de server draait.
        </p>
        <p style="margin-top:26px;">
          <button class="btn btn-primary" type="button"
                  onclick="window.location.reload();">
            Opnieuw proberen
          </button>
        </p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">&copy; 2026 MinecraftGooners</div>
  </footer>

</body>
</html>
